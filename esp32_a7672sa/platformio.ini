; A7672SA no ESP32 — cada subsistema é uma biblioteca em lib/
[platformio]
default_envs = esp32s3

; Comum aos dois alvos: só o board e o que dele decorre é que mudam.
[env]
; Fixo em 6.5.0 (arduino-esp32 2.0.x), o mesmo do projeto IHM_esp32 nesta
; placa. No core 3.x a biblioteca WiFi passou a depender de Network, que é um
; pacote à parte, e o LDF do PlatformIO não segue essa cadeia — o build morre
; em "Network.h: No such file or directory" ao compilar a própria WiFi.
platform  = espressif32@6.5.0
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -std=gnu++17
    -Wall
build_unflags = -std=gnu++11

; As libs de lib/ são descobertas sozinhas; chain+ resolve as dependências
; entre elas (Http inclui Net, Firebase inclui Tls, todas incluem Core) e
; avalia os #if dos headers.
;
; deep+ não serve aqui: ele varre também os .cpp das libs do framework e passa
; a compilar WiFi/ sem as dependências dela, quebrando em "Network.h: No such
; file" — no core 3.x o Network é uma biblioteca à parte.
lib_ldf_mode = chain+

; Placa da bancada: ESP32-S3 (QFN56) rev v0.2, flash 16 MB quad, PSRAM 8 MB.
[env:esp32s3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi   ; PSRAM octal: o mapa guarda tiles lá
board_build.filesystem = littlefs           ; cache de tiles do mapa

build_flags =
    ${env.build_flags}
    ; A placa fala com o PC por um CH340 ligado ao UART0, não pelo USB nativo
    ; do S3. Com CDC_ON_BOOT=1 o `Serial` iria para a porta USB nativa e o
    ; monitor no CH340 ficaria mudo — o firmware pareceria não ter subido.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    ; O VFS loga [E] a cada arquivo de tile ainda não baixado — é o caso normal
    ; do cache frio, e enterrava o log do firmware.
    -DCORE_DEBUG_LEVEL=0

    ; ── Display 4" ILI9488 SPI 480x320 ─────────────────────────
    ; Mesmo pinout do projeto IHM_esp32 (env ihm-esp32s3). Confirmado que não
    ; colide com o A7672: RX=16 TX=17 PWRKEY=4 STATUS=5 ficam de fora.
    -DUSER_SETUP_LOADED=1
    -DILI9488_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_MISO=-1
    -DTFT_CS=9
    -DTFT_DC=19
    -DTFT_RST=10
    -DTFT_BL=20
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=40000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    ; PNGdec guarda 2 linhas do filtro; 256px RGBA precisa 2*(256*4+1)=2050.
    -DPNG_MAX_BUFFERED_PIXELS=2100

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bitbank2/PNGdec@^1.0.3
    WiFi
    WiFiClientSecure
    HTTPClient
    LittleFS

; ESP32 clássico (WROOM). Mantido para gravar na outra placa sem editar nada.
[env:esp32dev]
board = esp32dev
