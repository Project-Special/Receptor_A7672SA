; A7672SA no ESP32 — cada subsistema é uma biblioteca em lib/
[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -std=gnu++17
    -Wall
build_unflags = -std=gnu++11

; As libs de lib/ são descobertas sozinhas; deep+ resolve as dependências
; entre elas (Http inclui Net, todas incluem Core).
lib_ldf_mode = deep+
